services:
  # 1. MySQL Database
  mysqldb:
    image: mysql:8.0
    container_name: academic_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: academic_db
      MYSQL_USER: harshini
      MYSQL_PASSWORD: harshini
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uharshini", "-pharshini"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend — FastAPI (Python 3.12)
  backend:
    build: ./backend
    container_name: academic_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysqldb
      DB_USER: harshini
      DB_PASSWORD: harshini
      DB_NAME: academic_db
      JWT_SECRET: asdfghjkmnbvcxwertyuiovcxcvbn
      CLIENT_ORIGIN: http://localhost:3000
    depends_on:
      mysqldb:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # 3. Frontend — React/Vite served by Nginx
  frontend:
    build: ./frontend
    container_name: academic_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
